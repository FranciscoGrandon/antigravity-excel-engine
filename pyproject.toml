# Creado por Francisco Grandón Vergara

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-excel-engine"
version = "1.0.0"
description = "The Enterprise-Grade, AI-Native Excel Automation Engine for Autonomous Agents and Data Pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Francisco Grandón Vergara", email = "francico.grandon@essbio.cl"}
]
dependencies = [
    "openpyxl>=3.1.2",
    "pywin32>=306; sys_platform == 'win32'"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["antigravity_excel_engine*"]
exclude = ["PRUEBAS*", "tests*"]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.urls]
"Homepage" = "https://github.com/franciscograndon/antigravity-excel-engine"

[project.scripts]
antigravity-excel = "antigravity_excel_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "real_com: marca pruebas que requieren una instancia real de Excel COM abierta",
]

[tool.coverage.run]
source = ["antigravity_excel_engine"]
omit = [
    "tests/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
